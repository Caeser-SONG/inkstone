name: Release desktop apps

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  prepare-release:
    name: Prepare GitHub Release
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.release.outputs.release_id }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify tag matches app version
        shell: bash
        run: |
          app_version="$(node -p "require('./package.json').version")"
          test "${GITHUB_REF_NAME}" = "v${app_version}" || {
            echo "Tag ${GITHUB_REF_NAME} must match package version v${app_version}."
            exit 1
          }

      - id: release
        name: Create or reuse draft release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if ! gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release create "${GITHUB_REF_NAME}" --draft --title "墨舟 ${GITHUB_REF_NAME}" --notes "macOS 与 Windows 11 安装包由 GitHub Actions 构建。"
          fi
          echo "release_id=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}" --jq .id)" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.name }}
    needs: prepare-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            platform: macos-14
            target: aarch64-apple-darwin
          - name: macOS Intel
            platform: macos-13
            target: x86_64-apple-darwin
          - name: Windows 11 x64
            platform: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and upload installer
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.prepare-release.outputs.release_id }}
          args: --target ${{ matrix.target }}
          releaseAssetNamePattern: "Inkstone_[version]_[platform]_[arch][_setup].[ext]"
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: "Inkstone-[platform]-[arch]-[bundle]"

  publish-release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Publish completed release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${GITHUB_REF_NAME}" --draft=false --latest
